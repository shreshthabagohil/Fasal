# Fasal — QLoRA iter-0 config (M3 step 7)
# These are the knobs we FIX ourselves (never searched by AutoScientist),
# per train/A0_LOCKED.md. The base A/B against google/gemma-2-2b was
# abandoned mid-event under GPU/Colab-quota and time pressure (see
# 08_MILESTONE_LOG.md) -- sarvam-1 is the sole trained/shipped base, not a
# measured A/B winner. base_candidates below is kept for provenance only.
#
# If AutoScientist's UI turns out to expose NO training-hyperparameter
# screen at all (only the data-recipe screen found at M0 — Prompt
# Rephrase/Dedup/House Special/etc.), this file is still the source of
# truth for a LOCAL fallback run (transformers + peft + bitsandbytes,
# already pinned in requirements.txt) so the run stays reproducible either way.

seed: 1729
# 2026-08-18: bumped after a full data-integrity fix pass -- see
# dataset/DATA_CARD.md "Addendum 2026-08-18" for the full incident writeup.
# data/tests.py had never actually been run against the true final
# 69,670-row merged dataset; doing so for the first time surfaced two real,
# pre-existing failures (D5 PII: 470 rows with live phone numbers that
# survived translation; D2b cross-lingual leakage: 668 unique question
# phrasings, 13,862 rows, shared between train and eval/heldout/test.jsonl).
# Both are now fixed at the source and verified: `python data/tests.py
# --dataset dataset/kcc_instruct_v1.jsonl --heldout eval/heldout/test.jsonl`
# reports all 6 gates PASS. Also folds in a separate call-redirect/KCC-noise
# filter (1,025 rows -- see data/clean_kcc.py's is_call_redirect()).
# New row count: 54,313 (was 69,670).
dataset_version_hash: "e16b774cf3d8a7c27dcbf24db25e5acb92657fc79615a576d304fa4abc975341"  # dataset/VERSION

qlora:
  quant: "nf4"
  bits: 4
  double_quant: true
  compute_dtype: "bf16"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: "all-linear"
  bias: "none"

training:
  num_train_epochs: 1
  # 2026-09-01: dropped from 3 -- Kaggle smoke test measured real throughput at
  # 16.56 s/step. At effective batch 16 (4 x grad_accum 4), 3 epochs over the
  # full 54,313-row dataset = 10,185 steps = ~47h GPU time for ONE seed, which
  # blows past a single Kaggle session (~9-12h cap) and the 30h/week quota
  # (needs 2 quota cycles just to finish). 1 epoch = ~15.6h, fits within this
  # week's quota across 2 resumed sessions. Run judge-sample eval on this
  # first; only spend more epochs/seeds if the eval justifies the GPU cost.
  max_seq_length: 2048
  learning_rate: 2.0e-4        # standard QLoRA starting point; adjust only with a logged reason
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  optim: "paged_adamw_8bit"

# Base A/B candidates (M3) -- kept for provenance; gemma-2-2b was never
# trained (A/B abandoned, see header note above and train/A0_LOCKED.md).
base_candidates:
  - name: "sarvamai/sarvam-1"
    commit_sha: "e9607337286ddf496d4a2562b194e489dcf3feea"
    license: "Sarvam AI Research License (non-commercial-flavored)"
  - name: "google/gemma-2-2b"
    commit_sha: "c5ebcd40d208330abc697524c919956e692655cf"
    license: "Gemma Terms of Use"
    status: "not attempted -- A/B abandoned under GPU/time pressure, never trained or evaluated"

chosen:
  base_model: "sarvamai/sarvam-1"
  base_commit_sha: "e9607337286ddf496d4a2562b194e489dcf3feea"  # locked 2026-08-10; Gemma-2-2B A/B never ran (cut for time), see train/A0_LOCKED.md

wandb:
  entity: "shreshthabagohil-personal"
  project: "fasal"
  run_name_prefix: "iter"   # e.g. iter-0-sarvam
